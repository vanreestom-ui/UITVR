<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UITVR — FAQ &amp; Annonces</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="dashboard-page">

  <div class="loading-screen" id="loading-screen">
    <div class="spinner"></div><span>Chargement…</span>
  </div>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo"><div class="logo-badge">BDE</div><span class="logo-text">UITVR</span></div>
    </div>
    <nav class="sidebar-nav">
      <span class="nav-label">Navigation</span>
      <a class="nav-item" href="/dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Tableau de bord</a>
      <a class="nav-item active" href="/faq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>FAQ &amp; Annonces</a>
      <a class="nav-item" href="/events"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Événements</a>
      <a class="nav-item" href="/treasury"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Trésorerie</a>
      <a class="nav-item" href="/admin" id="nav-admin-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Administration</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-avatar" id="sidebar-avatar">?</div>
      <div class="sidebar-user-info">
        <span class="sidebar-user-name" id="sidebar-user-name">…</span>
        <span class="sidebar-user-role" id="sidebar-user-role"></span>
      </div>
      <button class="btn-logout" id="logout-btn" aria-label="Se déconnecter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="topbar-title">FAQ &amp; Annonces</span>
    </header>

    <div class="content hidden" id="app-content">
      <div class="tabs">
        <button class="tab active" data-tab="questions">Questions</button>
        <button class="tab" data-tab="announcements">Annonces</button>
      </div>

      <section class="panel" id="panel-questions">
        <div class="panel-toolbar">
          <div class="filter-pills" id="question-filters">
            <button class="pill active" data-filter="all">Toutes</button>
            <button class="pill" data-filter="tome">Adressées à moi</button>
            <button class="pill" data-filter="mine">Mes questions</button>
          </div>
          <button class="btn btn-primary" id="new-question-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Nouvelle question
          </button>
        </div>
        <div id="question-list" class="item-list"></div>
        <div class="empty-state hidden" id="question-empty"><p>Aucune question pour le moment.</p></div>
      </section>

      <section class="panel hidden" id="panel-announcements">
        <div class="panel-toolbar">
          <div></div>
          <button class="btn btn-primary" id="new-announcement-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Nouvelle annonce
          </button>
        </div>
        <div id="announcement-list" class="item-list"></div>
        <div class="empty-state hidden" id="announcement-empty"><p>Aucune annonce pour le moment.</p></div>
      </section>
    </div>
  </main>

  <div class="modal-overlay hidden" id="modal-question">
    <div class="modal">
      <div class="modal-header"><h2>Nouvelle question</h2><button class="modal-close" data-close>×</button></div>
      <form id="question-form" class="modal-body">
        <div class="form-group"><label for="q-title">Titre</label><input type="text" id="q-title" required maxlength="200" placeholder="Ex : Budget gala 2026"></div>
        <div class="form-group"><label for="q-body">Détails (optionnel)</label><textarea id="q-body" rows="4" placeholder="Précisez votre question…"></textarea></div>
        <div class="form-group"><label>Pôles destinataires</label><div class="checkbox-grid" id="q-targets"></div></div>
        <div class="modal-actions"><button type="button" class="btn btn-ghost" data-close>Annuler</button><button type="submit" class="btn btn-primary">Publier</button></div>
      </form>
    </div>
  </div>

  <div class="modal-overlay hidden" id="modal-announcement">
    <div class="modal">
      <div class="modal-header"><h2>Nouvelle annonce</h2><button class="modal-close" data-close>×</button></div>
      <form id="announcement-form" class="modal-body">
        <div class="form-group"><label for="a-title">Titre</label><input type="text" id="a-title" required maxlength="200" placeholder="Ex : Réunion plénière vendredi"></div>
        <div class="form-group"><label for="a-body">Détails (optionnel)</label><textarea id="a-body" rows="5" placeholder="Le contenu de votre annonce…"></textarea></div>
        <div class="modal-actions"><button type="button" class="btn btn-ghost" data-close>Annuler</button><button type="submit" class="btn btn-primary">Publier</button></div>
      </form>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>
  <script src="/assets/faq.js"></script>
</body>
</html>
