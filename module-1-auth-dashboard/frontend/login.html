<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UITVR — Connexion</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon">BDE</div>
        <h1 class="auth-title">UITVR</h1>
        <p class="auth-subtitle">Plateforme de gestion interne</p>
      </div>

      <form id="login-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="username">Identifiant</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Votre identifiant"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Votre mot de passe"
              autocomplete="current-password"
              required
            >
            <button type="button" class="toggle-password" aria-label="Afficher ou masquer le mot de passe" id="toggle-password">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div id="login-error" class="error-message hidden" role="alert"></div>

        <button type="submit" class="btn btn-primary btn-full" id="login-btn">
          <span id="btn-text">Se connecter</span>
          <span id="btn-loader" class="hidden"><div class="spinner-sm"></div></span>
        </button>
      </form>

      <div class="auth-footer">
        <p>Session persistante &mdash; vous resterez connecté(e) 7&nbsp;jours</p>
      </div>
    </div>
  </div>

  <script src="/assets/auth.js"></script>
</body>
</html>
