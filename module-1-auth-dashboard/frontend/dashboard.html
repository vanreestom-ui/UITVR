<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UITVR — Tableau de bord</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="dashboard-page">

  <!-- Loading screen -->
  <div class="loading-screen" id="loading-screen">
    <div class="spinner"></div>
    <span>Chargement…</span>
  </div>

  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-badge">BDE</div>
        <span class="logo-text">UITVR</span>
      </div>
    </div>

    <nav class="sidebar-nav" aria-label="Navigation principale">
      <span class="nav-label">Navigation</span>

      <a class="nav-item active" id="nav-overview" href="#" data-section="overview" role="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
        Tableau de bord
      </a>

      <a class="nav-item disabled" href="#" aria-disabled="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        FAQ &amp; Annonces
        <span class="nav-badge">Bientôt</span>
      </a>

      <a class="nav-item disabled" href="#" aria-disabled="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        Événements
        <span class="nav-badge">Bientôt</span>
      </a>

      <a class="nav-item disabled" id="nav-treasury" href="#" aria-disabled="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="1" x2="12" y2="23"/>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
        Trésorerie
        <span class="nav-badge">Bientôt</span>
      </a>

      <a class="nav-item disabled" id="nav-admin" href="#" aria-disabled="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/>
        </svg>
        Administration
        <span class="nav-badge">Bientôt</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-avatar" id="sidebar-avatar">?</div>
      <div class="sidebar-user-info">
        <span class="sidebar-user-name" id="sidebar-user-name">…</span>
        <span class="sidebar-user-role" id="sidebar-user-role"></span>
      </div>
      <button class="btn-logout" id="logout-btn" title="Se déconnecter" aria-label="Se déconnecter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main" id="main-content" aria-live="polite">
    <!-- Topbar -->
    <header class="topbar">
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Ouvrir le menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <span class="topbar-title">Tableau de bord</span>
      <div class="topbar-right">
        <span class="topbar-date" id="topbar-date"></span>
      </div>
    </header>

    <!-- Dashboard content (hidden until loaded) -->
    <div class="content hidden" id="dashboard-content">

      <!-- Welcome card -->
      <div class="welcome-card">
        <div class="welcome-content">
          <h2 id="welcome-name">Bonjour !</h2>
          <p id="welcome-subtitle"></p>
          <div class="role-pill" id="role-pill"></div>
        </div>
        <div class="welcome-meta" id="welcome-meta"></div>
      </div>

      <!-- Stats row -->
      <div class="stats-grid" id="stats-grid"></div>

      <!-- Cards section -->
      <div class="section-grid">

        <!-- Module status -->
        <div class="card">
          <div class="card-header">
            <div class="card-header-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 11 12 14 22 4"/>
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
              </svg>
            </div>
            <h3>État des modules</h3>
          </div>
          <div class="card-body">
            <div class="module-list" id="module-list"></div>
          </div>
        </div>

        <!-- Permissions -->
        <div class="card">
          <div class="card-header">
            <div class="card-header-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </div>
            <h3>Vos permissions</h3>
          </div>
          <div class="card-body">
            <div class="perm-list" id="perm-list"></div>
          </div>
        </div>
      </div>

      <!-- Admin section: all accounts -->
      <div class="card hidden" id="admin-accounts-card" style="margin-top:1rem;">
        <div class="card-header">
          <div class="card-header-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>
          <h3>Comptes de l'application</h3>
        </div>
        <div class="card-body">
          <div class="account-list" id="account-list"></div>
        </div>
      </div>

    </div><!-- /dashboard-content -->
  </main>

  <script src="/assets/app.js"></script>
</body>
</html>
