[build]
  command = "npm install"
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  NODE_VERSION = "18"
  NODE_ENV = "production"

[functions]
  node_bundler = "zisi"
  included_files = [
    "app/frontend/**",
    "app/routes/**",
    "app/db.js",
    "app/server.js",
    "node_modules/sql.js/dist/sql-wasm.wasm"
  ]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
